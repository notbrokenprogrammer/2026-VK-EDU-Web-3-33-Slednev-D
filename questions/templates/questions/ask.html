{% extends "core/base.html" %}

{% block title %}Новый вопрос — Ответы{% endblock %}

{% block content %}
    <h1 class="page-title">Новый вопрос</h1>
    <form class="form-card" method="post" novalidate>
        {% csrf_token %}
        {% include "core/includes/fields.html" %}
        <div class="form-actions">
            <button class="btn btn-primary px-4" type="submit">Опубликовать вопрос</button>
            <a href="{% url 'questions:index' %}">Отмена</a>
        </div>
    </form>
{% endblock %}
