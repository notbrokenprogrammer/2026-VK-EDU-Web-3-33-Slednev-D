<article id="answer-{{ answer.pk }}" class="card answer-card" data-accepted="{{ answer.accepted|yesno:'true,false' }}">
    <div class="question-layout">
        {% include "questions/includes/author.html" with item=answer user=user route="questions:vote-answer" only %}
        <div class="question-content">
            <div class="answer-text">{{ answer.text|linebreaks }}</div>
            <div class="question-meta mb-3">
                <time datetime="{{ answer.created_at|date:'c' }}">{{ answer.created_at|date:"j E Y, H:i" }}</time>
            </div>
            {% if user.pk == question.author_id %}
                <label class="accept-label">
                    <input type="checkbox" class="form-check-input accept-input" data-answer="{{ answer.pk }}"
                           data-url="{% url 'questions:accept' question.pk %}" {% if answer.accepted %}checked{% endif %}>
                    Правильный ответ
                </label>
            {% elif answer.accepted %}
                <span class="text-success">Правильный ответ</span>
            {% endif %}
        </div>
    </div>
</article>
