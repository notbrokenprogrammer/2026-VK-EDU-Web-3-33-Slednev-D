services:
  db:
    image: postgres:16
    env_file: .env.docker
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build: .
    env_file: .env.docker
    environment:
      DJANGO_ENV_FILE: .env.docker
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - .:/app
      - media:/app/media

volumes:
  media:
  pgdata:
