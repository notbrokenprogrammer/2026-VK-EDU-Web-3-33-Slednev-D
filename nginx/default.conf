server {
    listen 80;
    client_max_body_size 8m;

    location /media/ {
        alias /srv/media/;
        add_header X-Content-Type-Options nosniff;
    }

    location /static/ {
        alias /srv/static/;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
