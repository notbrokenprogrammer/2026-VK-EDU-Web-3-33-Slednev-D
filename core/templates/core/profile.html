{% extends "core/base.html" %}
{% block title %}Профиль · Ответы{% endblock %}
{% block content %}
    <h1 class="page-title">Настройки профиля</h1>
    <form class="form-card" method="post" enctype="multipart/form-data" novalidate>
        {% csrf_token %}
        <p>Логин: {{ user.username }}</p>
        <img id="avatar-preview" class="form-avatar mb-3" src="{% include 'core/includes/avatar-url.html' with account=user only %}" alt="Аватар">
        {% include "core/includes/fields.html" %}
        <div class="form-actions">
            <button class="btn btn-primary px-4" type="submit">Сохранить изменения</button>
            <a href="{% url 'questions:index' %}">К вопросам</a>
        </div>
    </form>
{% endblock %}
