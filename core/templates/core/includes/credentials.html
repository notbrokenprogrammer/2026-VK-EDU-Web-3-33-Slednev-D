<div class="form-row">
    <label class="form-label" for="field-login">Логин</label>
    <input id="field-login" name="login" class="form-control" type="text" autocomplete="username"
           required minlength="3" maxlength="30" aria-describedby="field-login-error field-login-hint"
           data-feedback="field-login-error">
    <div class="invalid-feedback" id="field-login-error">Проверьте логин.</div>
    <div class="form-text" id="field-login-hint">От 3 до 30 символов.</div>
</div>
<div class="form-row">
    <label class="form-label" for="field-password">Пароль</label>
    <input id="field-password" name="password" class="form-control" type="password" autocomplete="{{ autocomplete }}"
           required minlength="8" maxlength="128" aria-describedby="field-password-error field-password-hint"
           data-feedback="field-password-error">
    <div class="invalid-feedback" id="field-password-error">Проверьте пароль.</div>
    <div class="form-text" id="field-password-hint">От 8 до 128 символов.</div>
</div>
