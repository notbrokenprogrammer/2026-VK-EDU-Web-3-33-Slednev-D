{% extends "core/base.html" %}
{% block title %}Вход · Ответы{% endblock %}
{% block content %}
    <h1 class="page-title">С возвращением!</h1>
    <form class="form-card" method="post" novalidate>
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">
        {% include "core/includes/fields.html" %}
        <div class="form-actions">
            <button class="btn btn-primary px-4" type="submit">Войти</button>
            <a href="{% url 'core:signup' %}">Создать аккаунт</a>
        </div>
    </form>
{% endblock %}
