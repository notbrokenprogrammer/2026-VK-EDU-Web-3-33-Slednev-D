{% extends "core/base.html" %}
{% block title %}Регистрация · Ответы{% endblock %}
{% block content %}
    <h1 class="page-title">Создать аккаунт</h1>
    <form class="form-card" method="post" enctype="multipart/form-data" novalidate>
        {% csrf_token %}
        <img id="avatar-preview" class="form-avatar mb-3" src="{% include 'core/includes/avatar-url.html' with account=user only %}" alt="Аватар">
        {% include "core/includes/fields.html" %}
        <div class="form-actions">
            <button class="btn btn-primary px-4" type="submit">Зарегистрироваться</button>
            <a href="{% url 'core:login' %}">Уже есть аккаунт?</a>
        </div>
    </form>
{% endblock %}
